<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Clothing Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="container">
      <h1>Simple Clothing Store</h1>
      <p>Browse products and manage your catalog.</p>
    </header>

    <main class="container grid">
      <section class="card">
        <h2>Products</h2>
        <p id="status" class="status">Loading products...</p>
        <ul id="product-list" class="product-list"></ul>
      </section>

      <section class="card">
        <h2>Add Product</h2>
        <form id="product-form" class="form">
          <label>
            Product Name
            <input type="text" id="name" name="name" required maxlength="120" />
          </label>
          <label>
            Price
            <input type="number" id="price" name="price" required min="0" step="0.01" />
          </label>
          <label>
            Category
            <input type="text" id="category" name="category" required maxlength="80" />
          </label>
          <button type="submit">Add Product</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
